name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        # --max-warnings 0, because a warning nobody has to act on is a warning
        # nobody reads.
        run: npx eslint --max-warnings 0
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Routes and bundle size
        # A page that quietly stops being prerendered, or a library that
        # arrives by accident, changes what every visitor downloads without
        # failing a type check or a test.
        run: npm run check:build
      - name: No answer code reaches the server
        # Drives a real browser at the production build, through a proxy that
        # records the request line the server receives, and fails if a set of
        # answers appears in one. It is the only check that can see the
        # difference between a fragment and a query string, because that
        # difference exists in the browser and not in any function.
        run: npm run check:privacy

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Advisories
        # The app ships no server of its own and holds no credential, so a
        # low-severity advisory in a build tool is not worth blocking a merge.
        # High and critical are.
        run: npm audit --audit-level=high
