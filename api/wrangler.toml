# Crible Politique API: encrypted profile vault + anonymous public statistics.
# Deploy: npx wrangler deploy -c api/wrangler.toml
# Secrets (set once, both required):
#   npx wrangler secret put SUB_PEPPER       -c api/wrangler.toml
#   npx wrangler secret put VAULT_KEY_PEPPER -c api/wrangler.toml
#   SUB_PEPPER: 32+ random bytes, peppers the storage key. Rotating it orphans
#   every vault (the rows can no longer be found), so it is set once.
#   VAULT_KEY_PEPPER: 32+ random bytes, peppers the vault keys. Rotating it
#   makes every stored vault unreadable. It MUST be a different value from
#   SUB_PEPPER: with one shared value, whoever holds the database holds the key
#   to every row in it.
name = "crible-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Served from the site's own domain rather than workers.dev: the browser then
# calls a sibling of the page it is on, so the request carries no third-party
# context, and the API keeps a stable address the day the Worker is renamed.
[[routes]]
pattern = "api.crible.eu"
custom_domain = true

[observability]
enabled = false # request bodies and tokens must never end up in logs

[vars]
# crible.deploy-env.net is the address the site still answers on until the A
# record for crible.eu exists; drop it from this list once the switch is done,
# or the old address keeps a working write path to the API.
ALLOWED_ORIGINS = "https://crible.eu,https://www.crible.eu,https://crible.deploy-env.net,http://localhost:3000"
# Public OAuth client id. Not a secret: it ships in every browser bundle. It is
# the audience every Google ID token is pinned to, so a token minted for any
# other application is refused here.
GOOGLE_CLIENT_ID = "206230920239-qog420lgsqev0q9earq6lgtrflj07no5.apps.googleusercontent.com"

# Bounds on the two things a caller can make this API do that cost something
# (SECURITY-CHECKLIST.md 18: "any operation that generates cost is bounded").
# Both count per caller address, in the edge, storing nothing durable.
#
# Removing either one does not open the route: the Worker answers 503 on it,
# because an unbounded write path is not an acceptable fallback for a missing
# binding. api/README.md says how to read that failure.
#
# 10 analyses per minute per address: a completed analysis fires exactly one
# event, so this is far above honest use even behind a shared connection, and
# far below what a script needs to move a public counter. A refused event is
# silently dropped by the browser and changes nothing for the reader.
[[ratelimits]]
name = "ANALYSES_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 20 authenticated calls per minute per address. Signing in costs two (the key
# and the read), saving one; the limit exists because verifying a Google
# signature is the expensive part of every one of them, and it is checked
# before the verification rather than after.
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "crible-politique"
database_id = "18d32b77-39ef-4f39-9373-cec2c3b6c357"
